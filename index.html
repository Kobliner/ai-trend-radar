<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="google-site-verification" content="9EWIArtMHVxnghf2l7D17D4Goh_0-KuhWWyVlzzlkbM" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 AI 트렌드 & 프롬프트 레이더</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --border: #334155;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        header p {
            color: var(--text-sub);
        }
        .container {
            width: 100%;
            max-width: 800px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }
        .tab-btn {
            background-color: var(--card-bg);
            color: var(--text-sub);
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background-color: var(--accent);
            color: #0f172a;
            border-color: var(--accent);
        }
        .section-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: var(--accent);
        }
        .card-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .rank-badge {
            background-color: #334155;
            color: var(--accent);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .status-badge {
            font-size: 0.85rem;
            color: #f43f5e;
            background: rgba(244, 63, 94, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
        }
        .card h3 {
            margin: 0 0 10px 0;
            font-size: 1.1rem;
        }
        .prompt-box {
            background-color: #0f172a;
            border: 1px dashed var(--border);
            padding: 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.9rem;
            color: #cbd5e1;
            margin-bottom: 15px;
            white-space: pre-wrap;
        }
        .copy-btn {
            background-color: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
        }
        .copy-btn:hover {
            background-color: rgba(56, 189, 248, 0.1);
        }
    </style>
</head>
<body>

 <header>
    <h1 id="site-title">⚡ Real-time AI Trend Radar</h1>
    <p id="site-subtitle">공개된 퍼블릭 신호를 기반으로 실무에서 가장 주목받는 AI 질문과 프롬프트를 확인하세요.</p>
</header>

    <div class="container">
        <!-- 탭 버튼 영역 -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('dev', this)">개발&코드</button>
            <button class="tab-btn" onclick="switchTab('business', this)">비즈니스</button>
            <button class="tab-btn" onclick="switchTab('creative', this)">콘텐츠</button>
            <button class="tab-btn" onclick="switchTab('sports', this)">스포츠</button>
            <button class="tab-btn" onclick="switchTab('game', this)">게임</button>
            <button class="tab-btn" onclick="switchTab('daily', this)">일상</button>
        </div>

        <!-- 컨텐츠 표시 영역 -->
        <div id="content-area">
            <p style="text-align: center; color: var(--text-sub);">데이터를 불러오는 중...</p>
        </div>
    </div>

    <!-- 지난 트렌드 히스토리 아카이브 섹션 -->
<section class="max-w-6xl mx-auto px-4 py-12 mt-12 border-t border-gray-800">
    <div class="flex items-center justify-between mb-8">
        <div>
            <h2 class="text-2xl font-bold text-white flex items-center gap-2">
                <svg class="w-6 h-6 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                트렌드 아카이브 히스토리
            </h2>
            <p class="text-gray-400 text-sm mt-1">시간대별로 기록된 역대 AI 트렌드 키워드 모음입니다.</p>
        </div>
    </div>

    <!-- 아카이브 카드가 동적으로 들어갈 자리 -->
    <div id="history-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- 자바스크립트로 데이터가 렌더링됩니다 -->
    </div>
</section>

    <script>
        let trendData = {};
        let currentTab = 'dev';

        // trends.json 데이터 불러오기
        async function loadTrends() {
            try {
                const response = await fetch('trends.json');
                if (!response.ok) throw new Error('데이터를 불러오지 못했습니다.');
                trendData = await response.json();
                renderTab(currentTab);
            } catch (error) {
                document.getElementById('content-area').innerHTML = 
                    `<p style="text-align: center; color: #f43f5e;">데이터 로드 실패: ${error.message}<br>로컬 서버 환경에서 실행 중인지 확인해주세요!</p>`;
            }
        }

        // 탭 전환 함수
        function switchTab(tabKey, btnElement) {
            currentTab = tabKey;
            
            // 버튼 활성화 스타일 변경
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            if (btnElement) {
                btnElement.classList.add('active');
            }

            renderTab(tabKey);
        }

        // 화면에 카드 리스트 그려주기
        function renderTab(tabKey) {
            const area = document.getElementById('content-area');
            const data = trendData[tabKey];

            if (!data) {
                area.innerHTML = '<p>데이터가 없습니다.</p>';
                return;
            }

            let html = `<div class="section-title">${data.title}</div><div class="card-list">`;

            data.items.forEach(item => {
                html += `
                    <div class="card">
                        <div class="card-header">
                            <span class="rank-badge">TOP ${item.rank}</span>
                            <span class="status-badge">🔥 ${item.count}</span>
                        </div>
                        <h3>${item.title}</h3>
                        <div class="prompt-box">${item.prompt}</div>
                        <button class="copy-btn" onclick="copyPrompt(this, \`${item.prompt}\`)">프롬프트 복사하기</button>
                    </div>
                `;
            });

            html += `</div>`;
            area.innerHTML = html;
        }

        // 클립보드 복사 기능
        function copyPrompt(button, text) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = button.innerText;
                button.innerText = '✨ 복사 완료!';
                button.style.backgroundColor = 'var(--accent)';
                button.style.color = '#0f172a';
                setTimeout(() => {
                    button.innerText = originalText;
                    button.style.backgroundColor = 'transparent';
                    button.style.color = 'var(--accent)';
                }, 1500);
            }).catch(err => {
                alert('복사 실패: ' + err);
            });
        }

        // 페이지 로드 시 데이터 가져오기 실행
        loadTrends();
    </script>
    <!-- 기존 HTML 내용들... -->

<script>
  // 1. 다국어 딕셔너리 데이터 정의
  const translations = {
    ko: {
      title: "⚡ Real-time AI Trend Radar",
      subtitle: "공개된 퍼블릭 신호를 기반으로 실무에서 가장 주목받는 AI 질문과 프롬프트를 확인하세요."
    },
    en: {
      title: "⚡ Real-time AI Trend Radar",
      subtitle: "Discover the most trending AI questions and prompts based on public signals."
    }
  };

  // 2. 언어 자동 적용 함수
  function initLanguage() {
    // 브라우저 기본 언어 감지 (한국어가 아니면 영어 기본 적용)
    const userLang = navigator.language.startsWith("ko") ? "ko" : "en";
    const t = translations[userLang] || translations.ko;
    
    document.getElementById("site-title").innerText = t.title;
    document.getElementById("site-subtitle").innerText = t.subtitle;
  }

  // 페이지 로드 시 실행
  window.addEventListener("DOMContentLoaded", initLanguage);
</script>

<script>
    // 1. 기존에 trends.json을 불러와서 화면에 그려주던 코드들...
    async function loadTrends() {
        // ... (생략)
    }
    loadTrends();


    // === 2. 이 아래에 방금 드린 아카이브 함수 코드를 그대로 붙여넣어 주세요! ===

    async function loadTrendHistory() {
        try {
            const response = await fetch('history.json');
            if (!response.ok) return;
            
            const historyData = await response.json();
            const container = document.getElementById('history-container');
            if (!container) return;

            container.innerHTML = '';

            const categoryNames = {
                "dev": "개발 & 코드",
                "business": "비즈니스",
                "creative": "콘텐츠 기획",
                "sports": "스포츠",
                "game": "게임",
                "daily": "일상"
            };

            historyData.forEach(entry => {
                const card = document.createElement('div');
                card.className = "bg-gray-900 border border-gray-800 rounded-xl p-5 hover:border-indigo-500/50 transition-all";

                let htmlContent = `
                    <div class="flex items-center justify-between mb-3 pb-2 border-b border-gray-800">
                        <span class="text-xs font-semibold text-indigo-400 bg-indigo-950/60 px-2.5 py-1 rounded-md">
                            ${entry.timestamp}
                        </span>
                    </div>
                    <div class="space-y-2">
                `;

                if (entry.keywords) {
                    for (const [catKey, titleText] of Object.entries(entry.keywords)) {
                        const catDisplayName = categoryNames[catKey] || catKey;
                        htmlContent += `
                            <div class="text-sm flex items-start gap-2">
                                <span class="text-gray-500 font-medium min-w-[75px]">• ${catDisplayName}:</span>
                                <span class="text-gray-300 truncate">${titleText}</span>
                            </div>
                        `;
                    }
                }

                htmlContent += `</div>`;
                card.innerHTML = htmlContent;
                container.appendChild(card);
            });

        } catch (error) {
            console.error("Failed to load trend history:", error);
        }
    }

    // 페이지가 로드될 때 아카이브도 같이 불러오도록 실행
    document.addEventListener('DOMContentLoaded', () => {
        loadTrendHistory();
    });
</script>
</body>
</html>
