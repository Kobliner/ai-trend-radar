<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="naver-site-verification" content="72add1ff14e690ce5248539848d69e12e10d74fa" />
  <meta name="google-site-verification" content="9EWIArtMHVxnghf2l7D17D4Goh_0-KuhWWyVlzzlkbM" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 AI 트렌드 & 프롬프트 레이더</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2097713212558648"
     crossorigin="anonymous"></script>
    <!-- Tailwind CSS CDN (태그 스타일 및 레이아웃 용도) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --border: #334155;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        header p {
            color: var(--text-sub);
        }
        .container {
            width: 100%;
            max-width: 800px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .tab-btn {
            background-color: var(--card-bg);
            color: var(--text-sub);
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background-color: var(--accent);
            color: #0f172a;
            border-color: var(--accent);
        }
        .section-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: var(--accent);
        }
        .card-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .rank-badge {
            background-color: #334155;
            color: var(--accent);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .status-badge {
            font-size: 0.85rem;
            color: #f43f5e;
            background: rgba(244, 63, 94, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
        }
        .card h3 {
            margin: 0 0 10px 0;
            font-size: 1.1rem;
        }
        .prompt-box {
            background-color: #0f172a;
            border: 1px dashed var(--border);
            padding: 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.9rem;
            color: #cbd5e1;
            margin-bottom: 15px;
            white-space: pre-wrap;
        }
        .copy-btn {
            background-color: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
        }
        .copy-btn:hover {
            background-color: rgba(56, 189, 248, 0.1);
        }
    </style>
</head>
<body>

    <!-- [제목 상단 광고 영역] -->
    <div class="mb-6 flex justify-center overflow-hidden w-full max-w-4xl px-4">
        <ins class="adsbygoogle"
             style="display:block; width:100%; max-width:728px; height:90px;"
             data-ad-client="ca-pub-2097713212558648"
             data-ad-slot="YOUR_AD_SLOT_ID"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
        <script>
             (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </div>

    <header>
        <h1 id="site-title">⚡ Real-time AI Trend Radar</h1>
        <p id="site-subtitle">공개된 퍼블릭 트렌드를 기반으로 실무에서 가장 주목받는 AI 질문과 프롬프트를 확인하세요.</p>
    </header>

    <div class="container">
        <!-- 탭 버튼 영역 -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('dev', this)">개발&코드</button>
            <button class="tab-btn" onclick="switchTab('business', this)">비즈니스</button>
            <button class="tab-btn" onclick="switchTab('creative', this)">콘텐츠</button>
            <button class="tab-btn" onclick="switchTab('sports', this)">스포츠</button>
            <button class="tab-btn" onclick="switchTab('game', this)">게임</button>
            <button class="tab-btn" onclick="switchTab('daily', this)">일상</button>
        </div>

        <!-- 컨텐츠 표시 영역 -->
        <div id="content-area">
            <p style="text-align: center; color: var(--text-sub);">데이터를 불러오는 중...</p>
        </div>
    </div>

    <!-- 지난 트렌드 히스토리 아카이브 섹션 -->
    <section class="max-w-4xl w-full mx-auto px-4 py-12 mt-12 border-t border-gray-800">
        <div class="mb-8">
            <h2 class="text-2xl font-bold text-white" id="history-section-title">
                이전 트렌드 히스토리
            </h2>
            <p class="text-gray-400 text-sm mt-1">선택한 카테고리의 직전 기록된 역대 AI 트렌드 키워드입니다.</p>
        </div>

        <!-- 아카이브 카드가 동적으로 들어갈 자리 -->
        <div id="history-container" class="flex flex-col gap-6">
            <!-- 자바스크립트로 데이터가 렌더링됩니다 -->
        </div>
    </section>

    <!-- [맨 하단 광고 영역] -->
    <div class="my-8 flex justify-center overflow-hidden w-full max-w-4xl px-4">
        <ins class="adsbygoogle"
             style="display:block; width:100%; max-width:728px; height:90px;"
             data-ad-client="ca-pub-2097713212558648"
             data-ad-slot="YOUR_AD_SLOT_ID"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
        <script>
             (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </div>

    <script>
        let trendData = {};
        let historyData = [];
        let currentTab = 'dev';

        const categoryNames = {
            "dev": "개발 & 코드",
            "business": "비즈니스",
            "creative": "콘텐츠 기획",
            "sports": "스포츠",
            "game": "게임",
            "daily": "일상"
        };

        // 데이터를 한 번에 불러오기
        async function loadAllData() {
            try {
                const [trendRes, historyRes] = await Promise.all([
                    fetch('trends.json'),
                    fetch('history.json')
                ]);

                if (trendRes.ok) trendData = await trendRes.json();
                if (historyRes.ok) historyData = await historyRes.json();

                renderTab(currentTab);
                renderHistory(currentTab);
            } catch (error) {
                document.getElementById('content-area').innerHTML = 
                    `<p style="text-align: center; color: #f43f5e;">데이터 로드 실패: ${error.message}</p>`;
            }
        }

        // 탭 전환 함수
        function switchTab(tabKey, btnElement) {
            currentTab = tabKey;
            
            // 버튼 활성화 스타일 변경
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            if (btnElement) {
                btnElement.classList.add('active');
            }

            renderTab(tabKey);
            renderHistory(tabKey);
        }

        // 화면에 메인 카드 리스트 그려주기
        function renderTab(tabKey) {
            const area = document.getElementById('content-area');
            const data = trendData[tabKey];

            if (!data) {
                area.innerHTML = '<p>데이터가 없습니다.</p>';
                return;
            }

            let html = `<div class="section-title">${data.title}</div><div class="card-list">`;

            data.items.forEach(item => {
                html += `
                    <div class="card">
                        <div class="card-header">
                            <span class="rank-badge">TOP ${item.rank}</span>
                            <span class="status-badge">🔥 ${item.count}</span>
                        </div>
                        <h3>${item.title}</h3>
                        <div class="prompt-box">${item.prompt}</div>
                        <button class="copy-btn" onclick="copyPrompt(this, \`${item.prompt}\`)">프롬프트 복사하기</button>
                    </div>
                `;
            });

            html += `</div>`;
            area.innerHTML = html;
        }

        // 선택한 탭에 맞는 이전 히스토리 직전 1건만 그려주기
        function renderHistory(tabKey) {
            const container = document.getElementById('history-container');
            if (!container) return;

            container.innerHTML = '';
            const catDisplayName = categoryNames[tabKey] || tabKey;

            // 히스토리 데이터 중 가장 최신 항목(index 0) 가져오기
            if (historyData && historyData.length > 0) {
                const entry = historyData[0];
                
                if (entry.keywords && entry.keywords[tabKey]) {
                    const titles = entry.keywords[tabKey];
                    
                    if (Array.isArray(titles) && titles.length > 0) {
                        const card = document.createElement('div');
                        card.className = "bg-gray-900 border border-gray-800 rounded-xl p-6 shadow-lg";

                        let htmlContent = `
                            <div class="flex items-center justify-between mb-4 pb-3 border-b border-gray-800">
                                <span class="text-xs font-semibold text-indigo-400 bg-indigo-950/60 px-3 py-1.5 rounded-md">
                                    🕒 직전 기록 시점: ${entry.timestamp}
                                </span>
                                <span class="text-xs font-bold text-gray-300">${catDisplayName} 히스토리</span>
                            </div>
                            <div class="space-y-4">
                                <div class="bg-gray-800/40 p-3 rounded-lg border border-gray-800">
                                    <div class="flex flex-wrap gap-2">
                        `;

                        titles.forEach(title => {
                            htmlContent += `
                                <div class="group relative inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium bg-gray-800 text-sky-300 rounded-lg border border-gray-700 hover:border-sky-500 transition-all shadow-sm">
                                    <span>#${title}</span>
                                    <button onclick="copyPrompt(this, \`${title}\`)" class="text-gray-400 hover:text-white ml-1 transition-colors" title="키워드 복사">
                                        📋
                                    </button>
                                </div>
                            `;
                        });

                        htmlContent += `
                                    </div>
                                </div>
                            </div>
                        `;
                        card.innerHTML = htmlContent;
                        container.appendChild(card);
                        return;
                    }
                }
            }

            // 해당 카테고리 히스토리가 없을 경우
            container.innerHTML = `
                <div class="bg-gray-900 border border-gray-800 rounded-xl p-6 text-center text-gray-400 text-sm">
                    ${catDisplayName} 카테고리의 이전 히스토리 데이터가 없습니다.
                </div>
            `;
        }

        // 클립보드 복사 기능
        function copyPrompt(button, text) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = button.innerText;
                button.innerText = '✨ 복사 완료!';
                button.style.backgroundColor = 'var(--accent)';
                button.style.color = '#0f172a';
                setTimeout(() => {
                    button.innerText = originalText;
                    button.style.backgroundColor = 'transparent';
                    button.style.color = 'var(--accent)';
                }, 1500);
            }).catch(err => {
                alert('복사 실패: ' + err);
            });
        }

        // 페이지 로드 시 데이터 가져오기 실행
        loadAllData();
    </script>

    <script>
        // 다국어 딕셔너리 데이터 정의
        const translations = {
            ko: {
                title: "⚡ Real-time AI Trend Radar",
                subtitle: "공개된 퍼블릭 트렌드를 기반으로 실무에서 가장 주목받는 AI 질문과 프롬프트를 확인하세요."
            },
            en: {
                title: "⚡ Real-time AI Trend Radar",
                subtitle: "Discover the most trending AI questions and prompts based on public trends."
            }
        };

        // 언어 자동 적용 함수
        function initLanguage() {
            const userLang = navigator.language.startsWith("ko") ? "ko" : "en";
            const t = translations[userLang] || translations.ko;
            
            document.getElementById("site-title").innerText = t.title;
            document.getElementById("site-subtitle").innerText = t.subtitle;
        }

        window.addEventListener("DOMContentLoaded", initLanguage);
    </script>
</body>
</html>
