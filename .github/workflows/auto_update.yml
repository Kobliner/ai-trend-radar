name: Auto Update AI Trends

on:
  schedule:
    # 매일 자정(UTC 기준, 한국 시간 아침 9시)에 자동 실행
    - cron: '0 0 * * *'
  workflow_dispatch:  # 수동으로도 언제든 실행 가능

jobs:
  update-trend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install openai

      - name: Run Trend Generator
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python update_trends.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add trends.json
          git diff --quiet && git diff --cached --quiet || (git commit -m "Auto-update trends.json via OpenAI" && git push)