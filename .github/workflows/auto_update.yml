name: Auto Update AI Trends

concurrency:
  group: auto-update-trends
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 0,4,10 * * *'
  workflow_dispatch:

jobs:
  update-trend:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-genai

      - name: Run Trend Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_trends.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add trends.json history.json
          git commit -m "Auto-update trends and history data" || echo "No changes to commit"
          git push origin main --force